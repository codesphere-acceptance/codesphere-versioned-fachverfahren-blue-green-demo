ceph:
    csiKubeletDir: /var/lib/kubelet
    cephAdmSshKey: # // TODO  replace with generated key
        publicKey: |
            ssh-rsa AAAAB3NzaC.....Fa8xBng841ZRrQ==
    nodesSubnet: 127.0.0.1/32   # // TODO : update subnet
    hosts:   # //TODO : add Ceph Nodes, only one can be master.  
        - hostname: ceph-01
          ipAddress: 1.2.3.4
          isMaster: true
        - hostname: ceph-02
          ipAddress: 1.2.3.5
          isMaster: false
    osds:
        - specId: default
          placement:
            host_pattern: '*'
          dataDevices:
  
            size: 350G:450G # //TODO : update disk size, give it range to avoid GB vs GiB issues 
            limit: 1
          dbDevices:
